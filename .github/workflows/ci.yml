name: Tests and packaging
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,plots]"
      - run: python -m pytest -q
      - run: python research/scripts/ffa_recompute_statistics.py --data research/data
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the built wheel rather than the source checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "${{ runner.temp }}"
          python -c "import vividRGB; import importlib.metadata as m; assert vividRGB.__version__ == m.version('vividRGB'); print(vividRGB.__file__)"
          vividrgb --version
