[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vividRGB"
version = "0.1.0"
description = "Discover dense visual cues with forced focused attention, PCA and regularized clustering"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Masahiro Ryo"}]
keywords = ["ecology", "DINOv3", "computer-vision", "PCA", "forced-focused-attention"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "pillow>=10,<13", "threadpoolctl>=3.1,<4"]

[project.optional-dependencies]
dino = ["torch>=2.5,<3", "torchvision>=0.20,<1", "transformers>=4.56,<6", "huggingface-hub>=0.34,<2"]
sam3 = ["torch>=2.5,<3", "torchvision>=0.20,<1", "transformers>=5.18,<6"]
plots = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "twine>=6,<8", "ruff>=0.12,<1", "pyyaml>=6,<7"]

[project.scripts]
vividrgb = "vividRGB.cli:main"

[project.urls]
Homepage = "https://kics-zert.projectcove.org/"
Repository = "https://github.com/masahiroryo-1988/vividRGB"
Issues = "https://github.com/masahiroryo-1988/vividRGB/issues"
Documentation = "https://github.com/masahiroryo-1988/vividRGB/blob/main/docs/usage.md"

[tool.hatch.build.targets.wheel]
packages = ["src/vividRGB"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "tools/", "docs/", "pyproject.toml", "LICENSE", "README.md", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
